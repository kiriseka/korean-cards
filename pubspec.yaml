name: korean_cards
description: "A new Flutter project."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  fsrs: ^2.0.1
  home_widget: ^0.10.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/sounds/

# App icon and splash, generated from tools/make_icon.py output:
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0047A0"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/monochrome.png

flutter_native_splash:
  color: "#0047A0"
  image: assets/icon/splash.png
  android_12:
    color: "#0047A0"
    image: assets/icon/splash.png
  ios: false
  web: false
